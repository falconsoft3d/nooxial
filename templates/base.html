<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Nooxial{% endblock %}</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0fde4',
              100: '#ddfac5',
              200: '#baf58e',
              300: '#9fe870',
              400: '#76d63e',
              500: '#56bc22',
              600: '#409618',
              700: '#317215',
              800: '#295b16',
              900: '#244d17',
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    }
  </script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans bg-white text-gray-900 antialiased">

  {% block body %}{% endblock %}

  {% block extra_scripts %}{% endblock %}

  {% if user.is_authenticated %}
  <!-- ─── WIDGET SOPORTE ─────────────────────────────────────── -->
  <div id="support-widget" class="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">

    <!-- Panel de chat -->
    <div id="support-panel" class="hidden w-80 bg-white rounded-3xl shadow-2xl border border-gray-100 overflow-hidden flex flex-col" style="height:420px;">
      <!-- Header -->
      <div class="bg-gray-900 text-white px-5 py-4 flex items-center justify-between flex-shrink-0">
        <div>
          <p class="font-bold text-sm">💬 Soporte Nooxial</p>
          <p class="text-xs text-gray-400">¿Necesitas ayuda? Escríbenos.</p>
        </div>
        <button onclick="toggleSupport()" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Mensajes -->
      <div id="support-msgs" class="flex-1 overflow-y-auto px-4 py-3 space-y-3 bg-gray-50">
        <p class="text-xs text-center text-gray-400">Cargando…</p>
      </div>

      <!-- Input -->
      <div class="px-4 py-3 border-t border-gray-100 bg-white flex gap-2 flex-shrink-0">
        <input id="support-input" type="text" placeholder="Escribe tu mensaje…"
               class="flex-1 border border-gray-200 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-300"
               onkeydown="if(event.key==='Enter') sendSupport()">
        <button onclick="sendSupport()"
                class="bg-gray-900 text-white text-xs font-semibold px-4 py-2 rounded-full hover:bg-gray-700 transition-colors">
          Enviar
        </button>
      </div>
    </div>

    <!-- Botón flotante -->
    <button onclick="toggleSupport()"
            class="bg-gray-900 text-white font-bold px-5 py-3 rounded-full shadow-lg hover:bg-gray-700 transition-colors flex items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
      <span id="support-btn-label">Soporte</span>
      <span id="support-badge" class="hidden bg-red-500 text-white text-xs font-black w-5 h-5 rounded-full flex items-center justify-center">!</span>
    </button>
  </div>

  <script>
  let supportOpen = false;

  function toggleSupport() {
    supportOpen = !supportOpen;
    const panel = document.getElementById('support-panel');
    panel.classList.toggle('hidden', !supportOpen);
    if (supportOpen) loadSupportMsgs();
  }

  function loadSupportMsgs() {
    fetch('{% url "accounts:support_messages" %}')
      .then(r => r.json())
      .then(data => {
        const box = document.getElementById('support-msgs');
        if (!data.messages.length) {
          box.innerHTML = '<p class="text-xs text-center text-gray-400">Aún no hay mensajes. ¡Escríbenos!</p>';
          return;
        }
        box.innerHTML = data.messages.map(m => `
          <div class="flex ${m.is_staff ? '' : 'justify-end'}">
            <div class="max-w-[85%] px-4 py-2.5 rounded-2xl text-sm ${m.is_staff
              ? 'bg-white border border-gray-200 text-gray-900'
              : 'bg-gray-900 text-white'}">
              <p>${m.content}</p>
              <p class="text-xs mt-1 opacity-50">${m.time}</p>
            </div>
          </div>`).join('');
        box.scrollTop = box.scrollHeight;
      });
  }

  function sendSupport() {
    const input = document.getElementById('support-input');
    const msg   = input.value.trim();
    if (!msg) return;
    input.value = '';
    const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
    fetch('{% url "accounts:support_send" %}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrf },
      body: 'content=' + encodeURIComponent(msg),
    }).then(() => loadSupportMsgs());
  }

  // Polling cada 15s si el panel está abierto
  setInterval(() => { if (supportOpen) loadSupportMsgs(); }, 15000);
  </script>
  {% endif %}
</body>
</html>
